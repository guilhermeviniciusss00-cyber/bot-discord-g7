services:
  - type: web
    name: bot-discord-g7
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python render_start.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
    healthCheckPath: /
